[project]
name = "fintl"
version = "0.3.2"
description = "Financial ETL CLI: parse, normalize, and explore your bank transaction data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["finance", "etl", "banking", "transactions", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
authors = [
    { name = "eschmidt42", email = "11818904+eschmidt42@users.noreply.github.com" }
]
requires-python = ">=3.14, <3.15"
dependencies = [
    "aiohttp>=3.13.4",
    "altair>=6.0.0",
    "beautifulsoup4>=4.14.3",
    "chardet>=7.3.0",
    "httpx>=0.28.1",
    "instructor>=1.14.5",
    "polars>=1.39.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pygments>=2.20.0",
    "python-dateutil>=2.9.0.post0",
    "rich>=14.3.3",
    "statsmodels>=0.14.4",
    "textual>=8.1.1",
    "urllib3>=2.7.0",
    "xlsxwriter>=3.2.9",
]

[project.urls]
Homepage = "https://github.com/eschmidt42/fintl"
Repository = "https://github.com/eschmidt42/fintl"
Issues = "https://github.com/eschmidt42/fintl/issues"

[project.scripts]
fintl = "fintl.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "inline-snapshot>=0.32.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

quality = [
    "ruff>=0.15.7",
    "ty>=0.0.25",
    "vulture>=2.16",
]

notebooks = [
    "ipywidgets>=8.1.8",
    "jupyter-server>=2.18.0",
    "mistune>=3.2.1",
    "nbconvert>=7.17.1",
    "notebook>=7.5.6",
    "pillow>=12.2.0",
    "plotnine>=0.15.7",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "notebooks" },
    "prek>=0.3.9",
]

[tool.pytest.ini_options]
markers = [
    "ollama: requires a running Ollama instance with a multimodal model (skipped by default; run with -m ollama)",
    "llama_swap: requires a running llama-swap instance with a multimodal model (skipped by default; run with -m llama_swap)",
]
testpaths = ["tests"]

[tool.inline-snapshot]
format-command="ruff check --fix-only --stdin-filename {filename} | ruff format --stdin-filename {filename}"

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
# https://docs.astral.sh/ruff/settings/#lintpydocstyle
select = [
    "I", # https://docs.astral.sh/ruff/rules/#isort-i
    "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "E", # https://docs.astral.sh/ruff/rules/#error-e
    "D", # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "C90", # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "N", # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "A", # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "C4", # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "LOG" # https://docs.astral.sh/ruff/rules/#flake8-logging-log
]

# On top of the Google convention, disable `D417`, which requires
# documentation for every function parameter.
ignore = ["D417"]

fixable = ["ALL"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { "fintl" = false, "aiohttp" = false } # exempt package so the testpypi sanity check works

[tool.uv.audit]
ignore-until-fixed = []
