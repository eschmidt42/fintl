# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

# Shared variables
env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.13"

# only push on tag creation
on:
  push:
    tags:
        - 'v*'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:

      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build a binary wheel and a source tarball
        run: uv build --sdist --wheel

      - name: Store the distribution packages
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  # publish to test-pypi if pre-release tag
  publish-to-testpypi:

    name: Publish Python 🐍 distribution 📦 to TestPyPI

    needs: [build]

    if: |
      contains(github.ref_name, 'a') ||
      contains(github.ref_name, 'b') ||
      contains(github.ref_name, 'rc') ||
      contains(github.ref_name, '.dev')

    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/fintl

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      actions: read    # required for actions/download-artifact

    steps:

      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:

    name: Publish Python 🐍 distribution 📦 to PyPI

    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b') &&
      !contains(github.ref_name, 'rc') &&
      !contains(github.ref_name, '.dev')

    needs: [build]

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fintl

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      actions: read    # required for actions/download-artifact

    steps:

      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test-testpypi-publication:
    name: Test TestPyPI publication
    needs: [publish-to-testpypi]
    if: contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, '.dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify TestPyPI installation
        run: |
          # Install the package from TestPyPI. TestPyPI publication can take a
          # short time to appear on the simple index, so retry with backoff.
          VERSION="${GITHUB_REF_NAME#v}"
          uv venv --python ${{ env.PYTHON_VERSION }}
          for attempt in 1 2 3 4 5; do
            if uv pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              fintl==${VERSION}; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Package fintl==${VERSION} was not available on TestPyPI after multiple attempts."
              exit 1
            fi

            sleep $((attempt * 10))
          done

          # Run a basic test using the venv interpreter so imports resolve to
          # the package installed from TestPyPI rather than the local checkout.
          .venv/bin/python scripts/check_import.py  || exit 1
