# https://docs.astral.sh/uv/guides/integration/github/#setting-up-python
name: CI

# Shared variables
env:
  UV_VERSION: "0.12.10"

on:
  push:
  # pull_request:


jobs:

  uv-example:
    name: python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14.7"


    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Security audit
        run: uv audit --preview-features audit

      - name: Install the project
        run: uv sync --frozen --no-default-groups --group test --group quality

      - name: Dead code check (vulture)
        run: |
          # Vulture reports unused variables too, but we only want to fail on
          # unused functions/classes (dead code with runtime impact).
          uv run --frozen --no-default-groups --group quality vulture src --min-confidence 90 > vulture.txt || true
          matches="$(grep -nE "unused (function|class)" vulture.txt || true)"
          if [ -n "$matches" ]; then
            printf "\nVulture found unused functions/classes:\n\n%s\n" "$matches"
            printf "\nFull vulture output:\n"
            cat vulture.txt
            exit 1
          fi

      - name: Run tests (with coverage)
        run: |
          uv run --frozen --no-default-groups --group test pytest tests --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschmidt42/fintl
